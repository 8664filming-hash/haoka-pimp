<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>好咖皮條客</title>
<meta name="description" content="政府標案、補助徵件、企劃提案與進行中進度，集中在這裡看">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2b7a70">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="皮條客">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v81">
<!-- 圖示：2026-11-16 新 icon（深藍底、米白長方塊、半深藍半橘紅的圓），檔名帶 ?v，iOS 才會抓新圖 -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v81">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v81">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v81">
<link rel="stylesheet" href="css/app.css?v81">
<!-- 網路字型只當加分：不擋畫面，載入完用 swap 換上；沒網路時走 css 裡的系統字型。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Noto+Serif+TC:wght@600;900&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Noto+Serif+TC:wght@600;900&display=swap"></noscript>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-l">
      <h1>好咖皮條客</h1>
      <p class="live" id="live" role="status"></p>
    </div>
    <div class="top-r">
      <p class="sum" id="sum"></p>
      <button class="fubtn" id="fubtn" type="button" aria-haspopup="dialog" aria-label="追蹤事項" hidden><span class="full">追蹤事項</span><span class="short">追蹤</span></button>
      <button class="archbtn" id="archbtn" type="button" aria-haspopup="dialog" aria-label="封存區"><span class="full">封存區</span><span class="short">封存</span></button>
      <button class="rkbtn" id="rkbtn" type="button" aria-haspopup="dialog" aria-label="跟肉咖說"><span>肉咖</span></button>
      <button class="holdbtn" id="holdbtn" type="button" aria-haspopup="dialog"></button>
    </div>
    <div class="hotrow" id="hot"></div>
  </header>
  <div class="notice" id="notice" hidden role="status"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="五個籃子"></nav>
  <main class="board" id="board"><div class="lanes" id="lanes"></div></main>
</div>
<button class="hpill" id="hpill" type="button" aria-haspopup="dialog"></button>
<div class="scrim" id="scrim"></div>
<aside class="panel sheet" id="sheet" role="dialog" aria-modal="true" aria-label="待決區"></aside>
<aside class="panel drawer" id="drawer" role="dialog" aria-modal="true" aria-label="詳細資料"></aside>
<div class="dlg-wrap" id="dlg" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<button class="updbar" id="updbar" type="button" hidden>有新版本，點一下更新</button>
<!-- 改版時 css／js 網址後面的 ?v 要跟 sw.js 的 CACHE 一起換，手機才不會拿到新舊混搭的檔 -->
<script type="module" src="js/app.js?v81"></script>
</body>
</html>
